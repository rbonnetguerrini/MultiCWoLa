# Bottleneck-head finetune profile pairing:
#   - simple `symmetry` augmentation (rotation + h/v flip only) -- same
#     augmentation kind as configs/train/galaxy10_symmetry_only.yaml,
#     used by the prior galaxy10_symmetry_finetune sweep
#   - longer bottleneck warmup so the simplex re-anchors before the
#     trunk dominates the loss
#
# Slack removal, vertex-spread bump, and pi warm-start from the
# linear-head finetune simplex are wired through the model config /
# CLI overrides in scripts/submit_resnet50_symmetry_only_bottleneck.sh.

defaults:
  - default

batch_size: 32
epochs: 12
lr: 5.0e-5
backbone_lr: 1.0e-5
weight_decay: 0.01
early_stopping_patience: 4
bottleneck_warmup_epochs: 8

augmentation:
  enabled: true
  kind: symmetry

mixup:
  enabled: false
  alpha: 0.0

sam:
  enabled: false
  rho: 0.0

label_smoothing: 0.0
early_stopping_metric: val_loss
