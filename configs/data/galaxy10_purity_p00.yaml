defaults:
  - galaxy10

# Purity sweep cell. With M=K=10 and pi_dirichlet_alpha large, the Dirichlet
# draw is effectively uniform, so condition_strength=p yields
# pi_m ~= (1-p) * (1/K) + p * e_m. Here p=0.0: every mixture has uniform
# class fractions (1/K) -- fully nonidentifiable.
pi_mode: dirichlet
pi_dirichlet_alpha: 1000.0
condition_strength: 0.0
