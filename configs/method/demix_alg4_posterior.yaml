method: demix_alg4_posterior
label: "Demix Alg. 4 posterior"
information_level: fair
representation: posterior_quantized_histogram
quantizer: kmeans
num_bins: 128
eps: 1e-8
face_eps: 1e-4
max_face_iter: 100
num_face_restarts: 20
num_nonsquare_restarts: 20
prior_mode: reconstruction
failure_policy: report_nan
random_state: ${seed}
