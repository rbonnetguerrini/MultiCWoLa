name: cnn
backbone: cnn
channels: [16, 32]
embedding_dim: 64
dropout: 0.1
bottleneck:
  enabled: false
  pi_init: identity_like
  pi_temperature: 1.0
  pi_normalization: softmax     # softmax | softplus
  slack_mode: none              # none | uniform | learnable
  slack_max: 0.2
  vertex_spread_lambda: 0.0

