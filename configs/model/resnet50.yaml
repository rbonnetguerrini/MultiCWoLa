name: resnet50
backbone: resnet50_pretrained
embedding_dim: 512
dropout: 0.1
freeze_backbone: true
imagenet_normalize: true
weights: DEFAULT                 # "DEFAULT" | "IMAGENET1K_V2" | "none"
bottleneck:
  enabled: true
  pi_init: identity_like
  pi_temperature: 1.0
  pi_normalization: softplus     # softmax | softplus
  slack_mode: learnable          # none | uniform | learnable
  slack_max: 0.2
  vertex_spread_lambda: 1.0e-3
