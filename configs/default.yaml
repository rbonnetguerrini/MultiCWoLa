defaults:
  - data: synthetic_gaussian
  - model: mlp
  - train: default
  - eval: default
  - simplex: archetypal_corner
  - method: null
  - experiment: clean_identifiable
  - _self_

seed: 7
task: synth
output_root: outputs
output_dir_override: null
run_baselines: true
run_wei_baselines: true
extra_simplex_methods: []
save_plots: true
save_checkpoints: true
reuse_checkpoints: false

# Optional fair-method variant: train a second source classifier with a centered
# tail nuclear-norm penalty on source posteriors, then fit one selected simplex.
low_rank_source:
  enabled: false
  method_name: ours_simplex_lowrank
  label: Ours simplex low-rank
  weight: 0.0
  centered: true
  target_rank: auto
  normalize_by: sqrt_batch
  simplex_config: archetypal_spread

# Wei et al. (ICLR 2024) oracle-prior baseline (CCM).
# train_overrides match the source-classifier budget for a fair comparison.
wei:
  train_overrides:
    batch_size: ${train.batch_size}
    epochs: ${train.epochs}
    lr: ${train.lr}
    weight_decay: ${train.weight_decay}
    early_stopping_patience: ${train.early_stopping_patience}
    num_workers: ${train.num_workers}

stage2:
  enabled: true
  hidden_dims: [64, 64]
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001

calibration:
  method: temperature
  max_iter: 300
  lr: 0.05

hydra:
  run:
    dir: ${output_root}/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S_%f}
